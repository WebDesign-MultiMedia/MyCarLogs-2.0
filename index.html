<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./src/output.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/225318ecee.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-800">

<nav class="flex flex-row justify-between items-center relative top-4 px-3 py-2 sm:px-4">
  <img src="./imgs/spare-parts.png" alt="" class="w-14 sm:w-20">
  <section>
    <ul class="flex flex-row gap-5 sm:gap-10 text-2xl sm:text-4xl bg-black px-4 py-3 sm:p-5 rounded-full text-logoClr">
      <li id="navClipboard" class="cursor-pointer"><i class="fa-sharp-duotone fa-light fa-clipboard-list"></i></li>
      <li id="navGears" class="cursor-pointer"><i class="fa-sharp-duotone fa-light fa-gears text-logoClrBlue"></i></li>
      <li id="navSpreadsheet" class="cursor-pointer"><i class="fa-sharp-duotone fa-light fa-file-spreadsheet text-spreadsheetClr"></i></li>
    </ul>
  </section>
</nav>

<main class="p-4 sm:p-8 lg:p-10">

  <!-- Maintenance / Repair Form -->
  <section id="logForm">
    <form action="" method="post" class="w-full flex justify-center">
      <fieldset class="w-full max-w-xl border-2 border-logoClr p-4 sm:p-6 rounded-lg flex flex-col gap-4">
        <legend class="px-2 text-txtWht text-sm sm:text-base">
          Maintaince | Repair
          <i class="fa-sharp-duotone fa-light fa-clipboard-list text-2xl text-logoClr"></i> |
          <i class="fa-duotone fa-solid fa-car-wrench text-2xl text-logoClr"></i>
        </legend>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 place-items-center" id="MaintainceRepair">
          <!-- Date -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="date" class="text-txtWht text-center">Date</label>
            <input type="date" id="date" name="date"
              class="w-full text-center rounded-md border border-logoClr bg-transparent text-txtWht p-2 focus:outline-none focus:ring-2 focus:ring-logoClr" />
          </div>

          <!-- Mileage -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="mileage" class="text-txtWht text-center">Mileage</label>
            <input type="number" id="mileage" name="mileage" placeholder="Enter Mileage"
              class="w-full text-center rounded-md border border-logoClr bg-transparent text-txtWht p-2 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-logoClr" />
          </div>

          <!-- Type -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="type" class="text-txtWht text-center">Type</label>
            <select name="type" id="type"
              class="w-full text-center rounded-md border border-logoClr bg-black/30 text-txtWht p-2 focus:outline-none focus:ring-2 focus:ring-logoClr">
              <option>-- choose type --</option>
              <option value="Maintenance">Maintenance</option>
              <option value="Repair">Repair</option>
            </select>
          </div>

          <!-- Location -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="VehicleSide" class="text-txtWht text-center">Location</label>
            <select name="VehicleSide" id="VehicleSide"
              class="w-full text-center rounded-md border border-logoClr bg-black/30 text-txtWht p-2 focus:outline-none focus:ring-2 focus:ring-logoClr">
              <option>-- car location --</option>
              <option>Front-Driver</option>
              <option>Front-Pass</option>
              <option>Rear-Driver</option>
              <option>Rear-Pass</option>
              <option>Front-(Drive|Pass)</option>
              <option>Rear-(Drive|Pass)</option>
              <option>Engine</option>
              <option>Transmission</option>
            </select>
          </div>

          <!-- Vehicle -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="vehicle" class="text-txtWht text-center">Vehicle</label>
            <select name="vehicle" id="vehicle"
              class="w-full max-w-sm text-center rounded-md border border-logoClr bg-black/30 text-txtWht p-2 focus:outline-none focus:ring-2 focus:ring-logoClr">
              <option value="">-- choose a car --</option>
              <option value="HP07">Honda Pilot 2007</option>
              <option value="HO10">Honda Odyssey 2010</option>
            </select>
          </div>

          <!-- Parts Count -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="partCount" class="text-txtWht text-center">Parts</label>
            <input type="number" id="partCount" name="partCount" placeholder="# of Parts Replaced"
              class="w-full text-center rounded-md border border-logoClr bg-transparent text-txtWht p-2 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-logoClr" />
          </div>

          <!-- Notes -->
          <div class="w-full sm:col-span-2 flex flex-col items-center gap-2">
            <label for="Notes_Issues" class="text-txtWht text-center">Notes / Issues</label>
            <textarea id="Notes_Issues" name="Notes_Issues" placeholder="Issues / Concerns / Reminders"
              class="w-full rounded-md border border-logoClr bg-transparent text-txtWht p-3 min-h-[110px] max-w-xl placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-logoClr"></textarea>
          </div>
        </div>

        <!-- Service Section (toggled by car-wrench icon) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 place-items-center" id="Service">
          <!-- Who did the job -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="service" class="text-txtWht text-center">Service</label>
            <input type="text" id="service" name="service" placeholder="Who did the Job?"
              class="w-full text-center rounded-md border border-logoClr bg-transparent text-txtWht p-2 focus:outline-none focus:ring-2 focus:ring-logoClr" />
          </div>

          <!-- Address -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="address" class="text-txtWht text-center">Address</label>
            <input type="text" id="address" name="address" placeholder="Enter Address"
              class="w-full text-center rounded-md border border-logoClr bg-transparent text-txtWht p-2 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-logoClr" />
          </div>

          <!-- Cost -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="cost" class="text-txtWht text-center">Cost</label>
            <input type="text" id="cost" name="cost" placeholder="Labor Cost"
              class="w-full text-center rounded-md border border-logoClr bg-transparent text-txtWht p-2 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-logoClr" />
          </div>
        </div>

        <button type="submit"
          class="w-full sm:w-2/3 mx-auto bg-black text-logoClr p-3 mt-2 rounded-lg hover:bg-gray-800 transition">
          Submit
        </button>
      </fieldset>
    </form>
  </section>

  <!-- Parts Form -->
  <section id="partsFormtwo" style="display:none">
    <form action="" method="post" class="w-full flex justify-center">
      <fieldset class="w-full max-w-xl border-2 border-logoClr p-4 sm:p-6 rounded-lg flex flex-col gap-4">
        <legend class="px-2 text-txtWht text-sm sm:text-base">
          Parts <i class="fa-duotone fa-thin fa-gears text-3xl text-logoClrBlue"></i>
        </legend>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 place-items-center" id="partsGrid">
          <!-- Date -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="partsDate" class="text-txtWht text-center">Date</label>
            <input type="date" id="partsDate" name="partsDate"
              class="w-full text-center rounded-md border border-logoClr bg-transparent text-txtWht p-2 focus:outline-none focus:ring-2 focus:ring-logoClr" />
          </div>

          <!-- Part Name -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="parts" class="text-txtWht text-center">Parts Replaced</label>
            <input type="text" id="parts" name="parts" placeholder="Enter Parts Replaced"
              class="w-full text-center rounded-md border border-logoClr bg-transparent text-txtWht p-2 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-logoClr" />
          </div>

          <!-- Brand -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="brand" class="text-txtWht text-center">Part Brand</label>
            <input type="text" id="brand" name="brand" placeholder="Enter Part Brand"
              class="w-full text-center rounded-md border border-logoClr bg-transparent text-txtWht p-2 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-logoClr" />
          </div>

          <!-- Parts Location -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="partsVehicleSide" class="text-txtWht text-center">Parts Location</label>
            <select name="partsVehicleSide" id="partsVehicleSide"
              class="w-full text-center rounded-md border border-logoClr bg-black/30 text-txtWht p-2 focus:outline-none focus:ring-2 focus:ring-logoClr">
              <option>-- car location --</option>
              <option>Front-Driver</option>
              <option>Front-Pass</option>
              <option>Rear-Driver</option>
              <option>Rear-Pass</option>
              <option>Front-(Drive|Pass)</option>
              <option>Rear-(Drive|Pass)</option>
              <option>Engine</option>
              <option>Transmission</option>
            </select>
          </div>

          <!-- Vehicle -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="partsVehicle" class="text-txtWht text-center">Vehicle</label>
            <select name="partsVehicle" id="partsVehicle"
              class="w-full max-w-sm text-center rounded-md border border-logoClr bg-black/30 text-txtWht p-2 focus:outline-none focus:ring-2 focus:ring-logoClr">
              <option value="">-- choose a car --</option>
              <option value="HP07">Honda Pilot 2007</option>
              <option value="HO10">Honda Odyssey 2010</option>
            </select>
          </div>

          <!-- Price -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="price" class="text-txtWht text-center">Price</label>
            <input type="text" id="price" name="price" placeholder="$ Enter Price of Parts"
              class="w-full text-center rounded-md border border-logoClr bg-transparent text-txtWht p-2 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-logoClr" />
          </div>

          <!-- Purchased At -->
          <div class="w-full max-w-sm flex flex-col items-center gap-2">
            <label for="purchased" class="text-txtWht text-center">Parts Bought:</label>
            <input type="text" id="purchased" name="purchased" placeholder="Amazon, Autozone, AdvAuto..."
              class="w-full text-center rounded-md border border-logoClr bg-transparent text-txtWht p-2 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-logoClr" />
          </div>
        </div>

        <button type="submit"
          class="w-full sm:w-2/3 mx-auto bg-black text-logoClr p-3 mt-2 rounded-lg hover:bg-gray-800 transition">
          Submit
        </button>
      </fieldset>
    </form>
  </section>

  <!-- Records View -->
  <section id="records" style="display:none">
    <div class="w-full max-w-5xl mx-auto">

      <div class="flex justify-between items-center mb-5">
        <h2 class="text-txtWht text-xl sm:text-2xl">Records</h2>
        <button id="refreshRecords"
          class="text-sm text-logoClr border border-logoClr px-3 py-1 rounded hover:bg-gray-700 transition">
          Refresh
        </button>
      </div>

      <!-- Filters -->
      <div class="flex flex-col gap-3 mb-6">
        <!-- Time filter -->
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-gray-400 text-xs uppercase tracking-widest w-14">Time</span>
          <button class="filter-time active-time px-3 py-1 rounded-full text-xs sm:text-sm border border-logoClr text-logoClr transition" data-days="0">All</button>
          <button class="filter-time px-3 py-1 rounded-full text-xs sm:text-sm border border-gray-600 text-gray-400 hover:border-logoClr hover:text-logoClr transition" data-days="30">Last 30 Days</button>
          <button class="filter-time px-3 py-1 rounded-full text-xs sm:text-sm border border-gray-600 text-gray-400 hover:border-logoClr hover:text-logoClr transition" data-days="90">Last 90 Days</button>
        </div>
        <!-- Vehicle filter -->
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-gray-400 text-xs uppercase tracking-widest w-14">Vehicle</span>
          <button class="filter-vehicle active-vehicle px-3 py-1 rounded-full text-xs sm:text-sm border border-logoClr text-logoClr transition" data-vehicle="all">All</button>
          <button class="filter-vehicle px-3 py-1 rounded-full text-xs sm:text-sm border border-gray-600 text-gray-400 hover:border-logoClr hover:text-logoClr transition" data-vehicle="HP07">Pilot &apos;07</button>
          <button class="filter-vehicle px-3 py-1 rounded-full text-xs sm:text-sm border border-gray-600 text-gray-400 hover:border-logoClr hover:text-logoClr transition" data-vehicle="HO10">Odyssey &apos;10</button>
        </div>
      </div>

      <div id="recordsContent"></div>
    </div>
  </section>

</main>

<script src="./ManRep.js"></script>
<script src="./parts.js"></script>
</body>
</html>
